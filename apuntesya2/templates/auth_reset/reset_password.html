{% extends "base.html" %}
{% block content %}
<div class="container mx-auto max-w-lg p-6">
  <h1 class="text-2xl font-bold mb-4">Crear nueva contraseña</h1>
  <form method="post" class="space-y-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="token" value="{{ token }}">
    <div>
      <label class="block mb-1">Nueva contraseña</label>
      <input name="password" type="password" required minlength="8" class="w-full border rounded p-2">
    </div>
    <div>
      <label class="block mb-1">Confirmar contraseña</label>
      <input name="password2" type="password" required minlength="8" class="w-full border rounded p-2">
    </div>
    <button type="submit" class="px-4 py-2 rounded bg-blue-600 text-white">Cambiar contraseña</button>
  </form>
</div>
{% endblock %}
