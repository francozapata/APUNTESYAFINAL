{% extends "base.html" %}
{% block content %}

<style>
  .maint-shell{
    max-width: 1100px;
    margin: 28px auto;
    padding: 0 16px;
  }

  .maint-card{
    background: #fff;
    border: 1px solid rgba(15, 23, 42, 0.08);
    border-radius: 18px;
    box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
    padding: 18px;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .maint-img{
    width: 100%;
    max-width: 900px;   /* ajustable */
    height: auto;
    display: block;
    border-radius: 14px; /* opcional: si querés suave */
  }

  /* Mobile: menos padding */
  @media (max-width: 520px){
    .maint-card{ padding: 12px; border-radius: 14px; }
    .maint-img{ border-radius: 12px; }
  }
</style>

<div class="maint-shell">
  <div class="maint-card">
    <img class="maint-img"
         src="{{ url_for('static', filename='img/maintenance_ay.png') }}"
         alt="ApuntesYa en mantenimiento">
  </div>
</div>

{% endblock %}
